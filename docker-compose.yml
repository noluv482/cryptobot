version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptobot
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
    environment:
      TG_TOKEN: ${TG_TOKEN}
      TG_CHAT_ID: ${TG_CHAT_ID}
      DASHBOARD_PIN: ${DASHBOARD_PIN}
      DATABASE_URL: postgresql://cryptobot:${DB_PASSWORD}@db:5432/cryptobot
      DATA_DIR: /data
      # These are read from .env but MUST be listed here: this service uses an
      # explicit environment block, not env_file, so unlisted vars never reach
      # the container. PAPER_LOCK defaults OFF in code, so omitting it made the
      # safety lock silently inert -- the other two default ON and so appeared
      # to work by accident.
      PAPER_LOCK: ${PAPER_LOCK:-0}
      # Paper champion/challenger allocator. Pinned ON for testing — it can NEVER
      # place a real order (every challenger is force_paper=True and it refuses to
      # run while is_live()). Literal "1" (not ${AUTOPILOT:-1}) so the value always
      # reaches the container regardless of host .env resolution. This is only the
      # FIRST-BOOT default: once you use the dashboard ON/OFF button, that choice is
      # authoritative and survives redeploys (set this to "0" to change the default).
      AUTOPILOT: "1"
      # Nightly research lab. Paper-only: it backtests lever sweeps on cached
      # history and writes reports + challenger nominations — it can NEVER touch
      # a live order. Literal "1" for the same reason as AUTOPILOT above: the
      # value must reach the container regardless of host .env resolution.
      RESEARCH_LAB: "1"
      # Optional lab tuning — uncomment to override the in-code defaults:
      #   RESEARCH_HOUR_UTC: "4"      # UTC hour the nightly cycle fires
      #   RESEARCH_BUDGET_MINS: "45"  # wall-clock cap per cycle before it checkpoints
      USE_MAKER_ENTRIES: ${USE_MAKER_ENTRIES:-1}
      ENTRY_ON_CLOSED_BAR: ${ENTRY_ON_CLOSED_BAR:-1}
      # Optional — leave blank to use dashboard API Keys instead
      KRAKEN_KEY: ${KRAKEN_KEY:-}
      KRAKEN_SECRET: ${KRAKEN_SECRET:-}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      # Optional — enables AI-powered news sentiment (Claude Haiku); falls back to keywords if blank
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_started

  # REMOVED 2026-09-24 — the quick tunnel published this dashboard to the open
  # internet. Verified from outside on 2026-09-20: GET / returned 200 and
  # 401,147 bytes, GET /status returned balance, P&L, win rate and the recent
  # trade list to anyone with the URL, with no authentication of any kind, on a
  # page carrying Kraken API key and secret input fields. An anonymous
  # trycloudflare hostname is not a secret; it is a URL that has been handed to
  # Cloudflare's edge and logged.
  #
  # The container was stopped that day, but stopping was not enough: this block
  # stayed here with restart: unless-stopped, so the next `docker compose up -d`
  # would have recreated it and quietly republished everything. Deleting the
  # block is what actually closes it.
  #
  # If remote access is wanted again, the answer is Tailscale (already running,
  # already private) or a NAMED Cloudflare tunnel with Access in front of it —
  # never an anonymous quick tunnel onto a port that can place orders.

  # Top-of-book recorder. Its OWN container, deliberately: it runs for weeks
  # unattended, and a crash, a memory leak or a wedged HTTP call must be able to
  # take down a data collector without touching the process that trades.
  # restart: unless-stopped is what makes it survive the 10-hour power cut this
  # machine had in September — once the BIOS is set to power on after AC loss.
  bbo:
    build: .
    restart: unless-stopped
    command: python bbo_recorder.py
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DELIBERATELY MINIMAL. Same explicit-environment rule as `bot` above —
      # unlisted vars never reach the container — and here that is a feature:
      # this service is given no TG_TOKEN, no DASHBOARD_PIN, no exchange key and
      # no PAPER_LOCK, because it needs none of them. It reads public market
      # data and writes two tables of its own. A credential it never receives is
      # one it can never leak.
      DATABASE_URL: postgresql://cryptobot:${DB_PASSWORD}@db:5432/cryptobot
      DATA_DIR: /data

  # The Kalshi favorites forward test (2026-09-19). A RECORDER, not a trader:
  # one unauthenticated public GET an hour, four tables of its own, no order
  # verb anywhere in the file. It exists because a venue-wide audit found 65
  # wins and 0 losses in this cell, which cannot bound a 2% tail — so the rule
  # was pre-registered and the data is being collected before any money moves.
  # `docker compose exec kalshi python kalshi_fav_recorder.py --status` reads
  # the verdict; it will say COUNTS ONLY for the first thirty settled events,
  # and that is the point.
  kalshi:
    build: .
    restart: unless-stopped
    command: python kalshi_fav_recorder.py
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same reasoning as `bbo`: a credential it never receives is one it can
      # never leak. Kalshi is read anonymously, so there is nothing to hold.
      DATABASE_URL: postgresql://cryptobot:${DB_PASSWORD}@db:5432/cryptobot
      DATA_DIR: /data
